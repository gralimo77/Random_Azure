<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wetter App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a8d8ea;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 18px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      background: rgba(255,255,255,0.15);
      color: white;
      outline: none;
      backdrop-filter: blur(10px);
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .search-box button {
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      background: #a8d8ea;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    .search-box button:hover {
      background: #ffffff;
    }

    .weather-card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      display: none;
    }

    .weather-card.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .city-name {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .date {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .weather-icon {
      font-size: 5rem;
      margin: 10px 0;
    }

    .temperature {
      font-size: 3.5rem;
      font-weight: bold;
      color: #a8d8ea;
    }

    .description {
      font-size: 1.1rem;
      text-transform: capitalize;
      margin: 10px 0 25px;
      color: rgba(255,255,255,0.8);
    }

    .details {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 15px;
      gap: 10px;
    }

    .detail-item {
      text-align: center;
    }

    .detail-item span {
      font-size: 1.3rem;
    }

    .detail-item p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .error-msg {
      color: #ff6b6b;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>☁️ Wetter</h1>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Stadt eingeben..." />
      <button onclick="getWeather()">Suchen</button>
    </div>

    <p class="error-msg" id="errorMsg">Stadt nicht gefunden.</p>

    <div class="weather-card" id="weatherCard">
      <div class="city-name" id="cityName">–</div>
      <div class="date" id="dateText">–</div>
      <div class="weather-icon" id="weatherIcon">🌤️</div>
      <div class="temperature" id="temperature">–°C</div>
      <div class="description" id="description">–</div>
      <div class="details">
        <div class="detail-item">
          <span>💧</span>
          <div id="humidity">–%</div>
          <p>Luftfeuchtigkeit</p>
        </div>
        <div class="detail-item">
          <span>💨</span>
          <div id="wind">– km/h</div>
          <p>Wind</p>
        </div>
        <div class="detail-item">
          <span>🌡️</span>
          <div id="feelsLike">–°C</div>
          <p>Gefühlt</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Demo-Daten für verschiedene Städte (kein API-Key nötig)
    const demoData = {
      "bern":    { temp: 18, feels: 16, humidity: 65, wind: 14, desc: "Leicht bewölkt",   icon: "⛅" },
      "zürich":  { temp: 20, feels: 19, humidity: 58, wind: 11, desc: "Sonnig",            icon: "☀️" },
      "genf":    { temp: 22, feels: 21, humidity: 55, wind: 9,  desc: "Klar",              icon: "🌞" },
      "london":  { temp: 14, feels: 12, humidity: 80, wind: 22, desc: "Regnerisch",        icon: "🌧️" },
      "berlin":  { temp: 17, feels: 15, humidity: 70, wind: 18, desc: "Bewölkt",           icon: "🌥️" },
      "paris":   { temp: 21, feels: 20, humidity: 60, wind: 13, desc: "Sonnig",            icon: "☀️" },
      "tokyo":   { temp: 28, feels: 30, humidity: 85, wind: 8,  desc: "Schwül",            icon: "🌫️" },
      "new york":{ temp: 25, feels: 26, humidity: 62, wind: 15, desc: "Teils bewölkt",     icon: "⛅" },
    };

    function getWeather() {
      const input = document.getElementById("cityInput").value.trim().toLowerCase();
      const card  = document.getElementById("weatherCard");
      const error = document.getElementById("errorMsg");

      error.style.display = "none";
      card.classList.remove("show");

      if (!input) return;

      const data = demoData[input];
      if (!data) {
        error.style.display = "block";
        return;
      }

      document.getElementById("cityName").textContent    = input.charAt(0).toUpperCase() + input.slice(1);
      document.getElementById("dateText").textContent    = new Date().toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" });
      document.getElementById("weatherIcon").textContent = data.icon;
      document.getElementById("temperature").textContent = data.temp + "°C";
      document.getElementById("description").textContent = data.desc;
      document.getElementById("humidity").textContent    = data.humidity + "%";
      document.getElementById("wind").textContent        = data.wind + " km/h";
      document.getElementById("feelsLike").textContent   = data.feels + "°C";

      card.classList.add("show");
    }

    // Enter-Taste unterstützen
    document.getElementById("cityInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") getWeather();
    });
  </script>
</body>
</html>
